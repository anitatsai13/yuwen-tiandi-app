<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>標點符號測驗｜國文 語文天地 B1</title>
<style>
:root{--bg:#faf6ee;--card:#ffffff;--ink:#3d3229;--muted:#8a7a68;--brand:#b03a2e;--brand2:#8e6f3e;--ok:#2e7d32;--bad:#c62828;--line:#e8dfd0;--chip:#f3ecdd;--gold:#f7efdc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px}
header{text-align:center;padding:18px 0 6px}
header h1{font-size:1.5rem;letter-spacing:.12em;color:var(--brand)}
header .sub{color:var(--muted);font-size:.85rem;margin-top:4px;letter-spacing:.05em}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 20px;font-size:1rem;cursor:pointer;font-weight:700}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.pane{display:none}.pane.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.stat{color:var(--muted);font-size:.85rem}
.btn{border:none;border-radius:12px;padding:11px 22px;font-size:1rem;font-weight:800;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:9px}
/* ===== 學習重點（表格版，仿講義） ===== */
.mtab{width:100%;border-collapse:collapse;background:var(--card);font-size:.9rem}
.mtab th,.mtab td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:1.75;text-align:left}
.mtab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap;letter-spacing:.3em;padding-right:calc(10px - .3em)}
.mtab td.nm{background:var(--chip);white-space:nowrap;text-align:center;font-weight:900}
.mtab td.nm .sym{display:block;color:var(--brand);font-size:1.25rem;margin-top:2px;font-weight:900}
.mtab td.wd{background:#fffdf8;white-space:nowrap;text-align:center;color:var(--muted);font-size:.82rem}
.mtab td .ln{display:block;margin:3px 0}
.mtab td.exc{color:var(--ink)}
.mtabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mtab{min-width:660px}
.hl{font-style:normal;font-weight:900;color:var(--brand);background:#fbd9b4;border-radius:4px;padding:0 3px;margin:0 1px}
.pn{background:#fbd9b4;border-radius:3px;padding:0 2px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--brand)}
.bn{background:#fbd9b4;border-radius:3px;padding:0 2px;text-decoration:underline wavy;text-underline-offset:5px;text-decoration-color:var(--brand)}
.cmp{width:100%;border-collapse:collapse;margin:14px 0;background:var(--card);border-radius:12px;overflow:hidden;font-size:.9rem}
.cmp th,.cmp td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;line-height:1.65}
.cmp th{background:var(--gold);color:var(--brand);white-space:nowrap}
.cmp td:first-child{background:var(--chip);white-space:nowrap;font-weight:700}
.cmpwrap{overflow-x:auto}
h2.sec{margin:22px 0 4px;font-size:1.05rem;color:var(--brand2);letter-spacing:.1em}
/* ===== 測驗 ===== */
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.exam .src{font-size:.72rem;background:var(--gold);color:var(--brand2);border-radius:6px;padding:2px 8px;margin-right:6px}
.exam .topic{font-size:.72rem;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px}
.exam .q{margin:10px 0;line-height:1.8;font-size:1.02rem}
.exam img.qi{max-width:min(320px,100%);display:block;margin:10px auto;border:1px solid var(--line);border-radius:10px}
.eopts{display:grid;gap:8px}
.eopt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fffdf8;border-radius:11px;padding:11px 13px;font-size:.98rem;cursor:pointer;line-height:1.7;color:var(--ink)}
.eopt .k{font-weight:900;color:var(--brand2);flex:none}
.eopt.correct{border-color:var(--ok);background:#eef7ee}
.eopt.wrong{border-color:var(--bad);background:#fdeeee}
.expl{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.75;font-size:.92rem}
.expl.show{display:block}
.expl .lbl{font-weight:900;color:var(--brand);margin-right:6px}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.counter{color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:8px}
.nav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:26px 16px;margin:14px 0}
.scorebox .big{font-size:2.2rem;font-weight:900;color:var(--brand)}
.review .r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;line-height:1.7}
.qitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.qitem .q{line-height:1.8;margin:6px 0;font-size:.95rem}
.qitem .o{color:var(--muted);font-size:.9rem;line-height:1.75;margin-top:4px}
.qitem .a{display:none;margin-top:8px;font-size:.9rem;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
.qitem .a.show{display:block}
.qitem .a b{color:var(--ok)}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:34px;letter-spacing:.05em}
@media(max-width:520px){header h1{font-size:1.25rem}.tab{padding:8px 14px;font-size:.92rem}}
</style>
</head>

<div class="wrap">
<header>
  <h1>📖 標點符號測驗</h1>
  <div class="sub">國文｜語文天地 B1｜學習重點＋題庫 88 題</div>
</header>
<div class="tabs">
  <button class="tab active" data-tab="learn">📚 學習重點</button>
  <button class="tab" data-tab="quiz">📝 測驗</button>
</div>

<div class="pane show" id="pane-learn">
  <h2 class="sec">標點符號使用法</h2>
  <div class="mtabwrap"><table class="mtab" id="marks"></table></div>
  <h2 class="sec">比較：頓號、逗號、分號</h2>
  <div class="cmpwrap"><table class="cmp" id="cmptab"></table></div>
</div>

<div class="pane" id="pane-quiz">
  <div class="row" id="secChips"></div>
  <div class="row" id="diffChips"></div>
  <div class="row"><button class="btn primary" id="startBtn">📝 開始測驗</button><span class="stat" id="poolStat"></span></div>
  <div id="quizBox"></div>
  <div id="qlist"></div>
</div>

<footer>康軒國中命題系統（114下）語文天地 B1 標點符號題庫</footer>

["唉！你為何那麼不用心！","記住！今天你必須完成它！","你看！這裡的風景多美啊！","同學們！只管朝著目標前進吧！"],"ans":1,"sec":"選擇題","diff":"易","src":"99基本學測二","exp":"（Ａ）感嘆　（Ｃ）讚嘆　（Ｄ）期勉","id":"2CH0870875","img":0},{"q":"「佛教裡常提到三苦：愛別離苦□怨憎會苦□求不得苦。」缺空處應填入下列何者最恰當？","opts":["：","。","、","……"],"ans":2,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812980","img":0},{"q":"「敘述記憶是件難事。記憶是一個整體，敘述的時候必須選擇將它一片片的切下，即使是一塊肉、一棵菜（甲）切下來後就再也拼不完整了，就算拼湊起來了（乙）也只算是死的標本，生命已蕩然（丙）何況記憶大部分的時候更像一陣風，來無影去無蹤的，要想將風片切下來，豈不完全是一場徒勞嗎（丁）」這段文字中的甲、乙、丙、丁四處，何者最適合使用標點符號中的句號？","opts":["甲","乙","丙","丁。"],"ans":2,"sec":"選擇題","diff":"易","src":"111教育會考","exp":"甲、乙處語意未完，語氣未結束，應填入逗號。丙處句子意思完足，應填入句號。丁處為反問語氣的句尾，應填入問號，故選（Ｃ）","id":"2CH1180007","img":0},{"q":"「學生遇到問題時□解決的方法有很多□例如□請教老師□查閱參考書等。」上述文句的缺空處依序應填入何組標點符號？","opts":["，，；，","，，—；","，；，、","，，：、"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812968","img":0},{"q":"「一直線，隨身掛，地名人名畫一畫／兩隻眼，張得大，碰它就有許多話／小蝌蚪，尾巴彎，暫時游在句中間／小耳朵，真勤奮，遇到疑難就發問」，上述文字是對四種標點符號的敘述，且皆先描寫外形，再說明用法。根據上文，這四種標點符號依序應為下列何者？","opts":["專名號／冒號／逗號／問號","專名號／冒號／頓號／引號","書名號／分號／頓號／問號","書名號／分號／逗號／驚嘆號。"],"ans":0,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812992","img":0},{"q":"用來標明語意轉變、聲音延續，或在行文中補充說明，必須使用下列何種標點符號？","opts":["破折號","分號","頓號","冒號。"],"ans":0,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812948","img":0},{"q":"「朋友曾問過我一個問題□失去視力和失去聽力，害怕哪一項？我思考許久，最後坦承：什麼也不想失去。眼睛的世界那樣可喜，聽見的聲音卻更像一種心靈的共振□閉上眼睛也能讓情節自己呼應。我不能放棄兩者□也不願被兩者放棄。」這段文字空格處的標點符號，依序填入下列何者最恰當？","opts":["， 。 ；","， ； 、","： ， ，","： 。 、"],"ans":2,"sec":"選擇題","diff":"易","src":"109教育會考","exp":"（Ｃ）文中的第一個缺空處後說明朋友提問的內容，故使用冒號「：」／文中的第二、三個缺空處前語意未完，故使用逗號「，」","id":"2CH0880294","img":0},{"q":"下列選項，何者不是標點符號的功用？","opts":["可以幫助讀者了解文意","可以避免誤讀和誤解","可以增加文章篇幅","可以使作者要表達的文意清楚、語氣貼切。"],"ans":2,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812955","img":0},{"q":"下列四句話的文字與標點符號稍有差異，何者含意與其他三者相差最遠？","opts":["哆啦Ａ夢說他要帶大雄去暢遊未來世界。","哆啦Ａ夢說：「他要帶大雄去暢遊未來世界。」","哆啦Ａ夢說：「我要帶大雄去暢遊未來世界。」","哆啦Ａ夢告訴大雄：「我要帶你去暢遊未來世界。」"],"ans":1,"sec":"選擇題","diff":"易","src":"105教育會考","exp":"（Ａ）（Ｃ）（Ｄ）意思是「哆啦Ａ夢要帶大雄去暢遊未來世界」　（Ｂ）哆啦Ａ夢說的「他」不是指哆啦Ａ夢自己，而是另有其人，故意思相差最遠","id":"2CH0880088","img":0},{"q":"若要表示有所刪簡省略，或表示語句斷斷續續，可以使用下列何種標點符號？","opts":["頓號","逗號","破折號","刪節號。"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812951","img":0},{"q":"「二手書籍商品享有十天的商品猶豫期□含例假日□。若您欲辦理退貨，請於取得該商品十日內寄回。」缺空處應填入下列何者最恰當？","opts":["……","〈　〉","「　」","（　）"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812979","img":0},{"q":"「差不多先生差不多要死的時候，一口氣斷斷續續地說道：『活人同死人也差……差……差……不多，……凡事只要……差……差……不多……就……好了，……何……必……太……太認真呢？』」（胡適 差不多先生傳）上述文句中使用的刪節號，具有什麼作用？","opts":["表示節略原文","表示害怕而說不出口","表示語句斷斷續續","表示語句未完、意思未盡。"],"ans":2,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812963","img":0},{"q":"用於原住民命名習慣之間隔、翻譯外國人名字與姓氏之間的標點符號，應是下列何者？","opts":["專名號","連接號","間隔號","夾注號。"],"ans":2,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812952","img":0},{"q":"「彎曲的生命旅路，常常會被安排與許多人與事錯身而過甲有些注定是淡漠的乙並淪為遺忘丙有些則產生強烈衝擊丁終至刻骨銘心。」這段文字中的甲、乙、丙、丁四處，何者最適合使用標點符號中的分號？","opts":["甲","乙","丙","丁。"],"ans":2,"sec":"選擇題","diff":"易","src":"112教育會考","exp":"分號，適用於分開複句中平列的句子。「有些注定是淡漠的，並淪為遺忘」、「有些則產生強烈衝擊，終至刻骨銘心」皆以「有些」起首，為平列的句子，故丙處宜用分號。甲處前語意完整，故甲處宜用句號。乙、丁處隔開複句內各分句，故乙、丁處宜用逗號。故選（Ｃ）","id":"2CH1280003","img":0},{"q":"想要標明人名必須使用專名號，在直行及橫行書寫時，分別要標示在何處？","opts":["左邊／上面","左邊／下面","右邊／上面","右邊／下面。"],"ans":1,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812950","img":0},{"q":"「我寧願去品嘗辛辣的憤怒，憤怒潑辣中仍不失狂放的熱情□我也寧願去深深咀嚼苦味，苦味中還有深沉的傷痛與悲哀，可以痛定思痛，有猛省的作用□唯獨酸腐，只有餿臭敗壞一途，是生命最無意義的浪費啊□」文中缺空處，依序填入下列哪一組標點符號最恰當？","opts":["， ： ——","， ； ……","； 。 ！","； ， ？"],"ans":2,"sec":"選擇題","diff":"易","src":"107教育會考","exp":"（Ｃ）第一個缺空處前後為複句中平列的句子，故使用分號「；」／第二個缺空處前對於苦味的描述意思完足，故使用句號「。」／第三個缺空處前為感嘆語氣，故使用驚嘆號「！」","id":"2CH0880205","img":0},{"q":"「從前自小鎮望出，在想像裡，島的樣子是中央山脈與海岸山脈之間的天空，從小小的視野想像大大的島□後來才知道島也就這麼小。」句中缺空處應填入下列何者最恰當？","opts":["；","。","：","—"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812978","img":0},{"q":"用來連接時空起止或數量多寡等的標點符號，應是下列何者？","opts":["連接號","夾注號","刪節號","間隔號。"],"ans":0,"sec":"選擇題","diff":"易","src":"","exp":"","id":"2CH0812953","img":0},{"q":"關於冒號的使用方式，下列何者說明錯誤？","opts":["書寫時要占一格","在書信的稱呼底下，應加上冒號","在提出引語時可以加上冒號","冒號主要用在並列連用的詞、語之間。"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"（Ｄ）應為頓號","id":"2CH0812969","img":0},{"q":"文章裡用來標明語意轉變、聲音延續或在行文中補充說明的符號稱為「破折號」。下列文句中的破折號，何者是用來表示「語意的轉變」？","opts":["煙火「咻——」一聲衝向雲霄，隨即照亮了整個夜空","這趟日本之旅，我來到了伊豆——川端康成的第二個故鄉","到了三十歲，她終於完成自己的夢想——徒步走完西班牙的朝聖之路","他擁有美滿的家庭，本來是很幸福的——不料，難纏的病症卻入侵了他的生活。"],"ans":3,"sec":"選擇題","diff":"易","src":"","exp":"（Ａ）表示「聲音延續」　（Ｂ）（Ｃ）表示「補充說明」","id":"2CH0813272","img":0},{"q":"以標點符號的作用來看，下列哪一句表達的意思是「可以臨時停車」？","opts":["駕駛等，不得於此臨時停車","駕駛等不得於此，臨時停車","駕駛等，不得於此，臨時停車","駕駛，等不得，於此臨時停車。"],"ans":3,"sec":"選擇題","diff":"中","src":"94基本學測二","exp":"（Ａ）（Ｂ）（Ｃ）皆表示駕駛不可於此臨時停車","id":"2CH0870480","img":0},{"q":"下列文句的標點符號，何者使用最恰當？","opts":["小弟弟聰明伶俐，富有好奇心，什麼事都非要打破沙鍋問到底不可？","我不是跟你說過嗎？要得到好成績，不用功是不行的。為何你總是置若罔聞？","對於這項工作，一來，我沒有這份才能、再來，也沒有時間，只好敬謝不敏了。","文明的現代：戰爭仍然層出不窮，不禁令人懷疑—歷史是前進的，抑或倒退的。"],"ans":1,"sec":"選擇題","diff":"中","src":"108教育會考","exp":"（Ａ）句末意思完足，且為肯定語氣，宜用「句號」結尾　（Ｃ）兩項拒絕的理由「一來，我沒有這份才能」與「再來，也沒有時間」屬於複句中平列的句子，宜用「分號」隔開　（Ｄ）首句「文明的現代」語意未完，宜接「逗號」／末句提出疑問「歷史是前進的，抑或倒退的」，宜用「問號」結尾","id":"2CH0880253","img":0},{"q":"文章裡用來標明語意轉變、聲音延續，或在行文中補充說明的符號，稱為「破折號」。下列各句破折號的使用，何者正確？","opts":["嗚—嗚—嗚—，警報的聲音又響起來了","勤勞能幫助農人，使他收穫豐富—幫助學生，使他成績優良","人在最小的事上忠心，在大事上也忠心—在最小的事上不義，在大事上也不義","下一列高鐵班車是從臺北—左營。"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812973","img":0},{"q":"「田野裡白天的風景和情形，有詩人把它寫成美妙的詩，有畫家把它畫成生動的畫□到了夜間，詩人喝了酒，有些醉了；畫家呢，正在抱著精緻的樂器低低地唱。他們都沒有工夫到田野裡來，那麼，還有誰把田野裡夜間的風景和情形告訴人們呢□有□還有□就是稻草人。」文中□處，依序應填入何種標點符號最恰當？","opts":["——！，、","。？、、","——！、，","。？，，"],"ans":3,"sec":"選擇題","diff":"中","src":"100北北基聯測","exp":"第一句敘述白天詩人、畫家針對田野景色呈現出不同的作品，語意已完結，故使用「。」；由「還有誰……呢」可知此句為疑問句，故使用「？」；回答提問時先給予肯定答覆，語意未完再加以說明，故末兩格使用「，」，故選（Ｄ）","id":"2CH0871011","img":0},{"q":"下列各句標點符號的使用，何者完全正確？","opts":["孔子曾說：「有朋自遠方來，不亦樂乎？」這句話告訴我們：交友是一件令人欣喜的事。","孔子曾說「有朋自遠方來，不亦樂乎？」這句話告訴我們：交友是一件令人欣喜的事。","孔子曾說「有朋自遠方來，不亦樂乎？」這句話告訴我們：「交友是一件令人欣喜的事。」","孔子曾說：「有朋自遠方來，不亦樂乎？」這句話告訴我們：「交友是一件令人欣喜的事」。"],"ans":0,"sec":"選擇題","diff":"中","src":"95基本學測二","exp":"「：」用於提起下文及說明上文，所以「孔子曾說」後面要加「：」，「有朋自遠方來，不亦樂乎」為一個反問句，故加「？」；「交友是一件令人欣喜的事」為上文「這句話告訴我們」的說明，故加「：」，不必加「」","id":"2CH0870579","img":0},{"q":"根據美琪和安娜的對話內容，下列何者為安娜回應美琪的話？","opts":["不要給別人。","不要給？別人！","不，要給別人？","不要，給別人。"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"（Ｂ）不給我嗎？竟然給別人！　（Ｃ）我不要，你要給別人嗎？　（Ｄ）我不要，你給別人。","id":"2CH0813274","img":1},{"q":"「正因為有仇恨的可怕，人們才有愛與關懷的需求□正因為人生有種種缺憾和不如意，我們才不斷學習寬容□學習知足與感恩。」句中□處，依序應填入何種標點符號？","opts":["，、","。、","；；","；、"],"ans":3,"sec":"選擇題","diff":"中","src":"94基本學測一","exp":"文中第一個缺空處，位於兩組並列分句之中，故用「；」；第二個缺空處，位於兩個同類詞語之中，故用「、」。因此答案選（Ｄ）","id":"2CH0870448","img":0},{"q":"下列選項中，何者標點符號的使用最恰當？","opts":["陶淵明詩自然、質樸，看似平淡，其實意味深長。其詩多寫田園隱居生活，後世譽為「隱逸詩人」之宗。","陶淵明詩自然質樸、看似平淡其實意味深長；其詩多寫田園隱居生活，後世譽為「隱逸詩人」之宗。","陶淵明詩自然、質樸、看似平淡，其實意味深長。其詩多寫田園隱居生活，後世譽為「隱逸詩人」之宗。","陶淵明詩自然、質樸；看似平淡；其實意味深長；其詩多寫田園、隱居生活，後世譽為「隱逸詩人」之宗。"],"ans":0,"sec":"選擇題","diff":"中","src":"93基本學測二","exp":"能理解分號「；」與頓號「、」的用法，即能選出正確答案","id":"2CH0870380","img":0},{"q":"「面對未來，你是否經常覺得很茫然，總覺得抓不到自己的性向和專長□如果你有這樣的困惑，建議你建立一個『仿冒』的人生□抓一個你可以仿冒的對象，去學習他的成長軌跡□從中找出你的方向。」上述文句的缺空處依序應填入何組標點符號？","opts":["？：，","！：~","？、。","！、。"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812966","img":0},{"q":"標點符號中的破折號，用「——」來標示，有語意的轉變、聲音的延續、時空的起止、夾注說明等不同的作用。下列句中的破折號，何者是用來標明「語意的轉變」？","opts":["「哇——哇——哇——」，真好，又有新生命誕生了","從北到南（基隆——嘉義），我狂飆了兩個半小時","這是他生平所收到的第一個生日禮物——毛線帽","我實在不贊同這個主意——也罷，就依你們吧。"],"ans":3,"sec":"選擇題","diff":"中","src":"97基本學測一","exp":"（Ａ）標明「聲音的延續」　（Ｂ）標明「時空的起止」　（Ｃ）標明「夾注說明」　（Ｄ）「——」前後語意不同，可知是用來標明「語意的轉變」","id":"2CH0870681","img":0},{"q":"下列文句中標點符號的使用，何者正確？","opts":["上天喜悅誰，就給誰智慧；知識；和喜樂。","永遠扮你的角色；那麼你想成什麼人；就成什麼人！","快樂的基本因素是，有事可為；有所愛慕；有所希望。","小心眼的人議論人；普通心思的人談論事；偉大心靈的人討論觀念。"],"ans":3,"sec":"選擇題","diff":"中","src":"91基本學測二","exp":"（Ａ）應改為「上天喜悅誰，就給誰智慧、知識和喜樂」　（Ｂ）應改為「永遠扮你的角色——那麼你想成什麼人，就成什麼人」　（Ｃ）應改為「快樂的基本因素是：有事可為，有所愛慕，有所希望」","id":"2CH0870201","img":0},{"q":"「只要持續做下去，三年□五年□十年，成果是難以想像的。」句中空格應填入哪一種標點符號最恰當？","opts":["？","~","、","："],"ans":2,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812971","img":0},{"q":"下列文句中的標點符號，何者使用正確？","opts":["行者罵道：「敢稱仙洞？「仙」字是你稱的？」","康、張、姚、李道：「兄長不必多敘，請旨發落去也。」","菩薩道：「怎歷得這萬水千山，怎到得那靈山佛地。」","行者看道：「妙啊，妙啊？這是妖精菩薩，還是菩薩妖精。」"],"ans":1,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812981","img":0},{"q":"「（甲）冒號　（乙）夾注號　（丙）問號　（丁）驚嘆號　（戊）刪節號　（己）破折號」，上述標點符號哪幾個具有「說明」的作用？","opts":["乙丙丁","甲戊己","丙丁戊","甲乙己。"],"ans":3,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812994","img":0},{"q":"老師請小青為下列文句加上標點符號，何者使用完全正確？","opts":["既然是來游泳的，何懼乎水？不嗆幾口水，怎麼學得會游泳呢？","世界上有兩種話必須一聽就懂：因為它們不堪重複，第一是幽默的話、第二是恭維的話。","無論你多苦口婆心或者繡口錦心，臺下儼然危坐的學生之中，真正心領神會的：永遠只有那麼三五個人。","借錢是一種神經戰，緊張的程度——可比求婚——因為兩者都是祕密進行，而面臨的答覆，至少有一半可能是「不肯」。"],"ans":0,"sec":"選擇題","diff":"中","src":"100基本學測一","exp":"（Ｂ）世界上有兩種話必須一聽就懂，因為它們不堪重複：第一是幽默的話，第二是恭維的話。　（Ｃ）無論你多麼苦口婆心或者繡口錦心，臺下儼然危坐的學生之中，真正心領神會的，永遠只有那麼三五個人。　（Ｄ）借錢是一種神經戰，緊張的程度可比求婚，因為兩者都是祕密進行，而面臨的答覆，至少有一半可能是「不肯」。","id":"2CH0870916","img":0},{"q":"下列文句的標點符號，何者使用最適當？","opts":["她堅持每天早起跑步，享受晨曦中的清新空氣，這令她精神飽滿？","這次旅行的目的地──充滿歷史與文化的古城──讓我非常期待。","他時常窩在圖書館的原因是什麼：或許是喜歡沉浸於知識的海洋。","我們時常相約到公園散步、一邊欣賞風景，一邊暢談生活的點滴。"],"ans":1,"sec":"選擇題","diff":"中","src":"","exp":"（Ａ）句末意思完足，宜用句號「。」結尾　（Ｃ）「他時常窩在圖書館的原因是什麼」提出疑問，宜接問號「？」　（Ｄ）「我們時常相約到公園散步」語意未完，宜接逗號「，」","id":"2CH0814982","img":0},{"q":"「閱讀本書三階段：一□不寒而慄、全身發冷。二□震驚無比，腎上腺素爆發！三□痛哭流涕之際，深感人生充滿希望」句中空格應填入哪一種標點符號最恰當？","opts":["。","、","．","—"],"ans":1,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812970","img":0},{"q":"「，逗號俏皮／。句號完美／？問號張大口／！驚嘆號眼淚欲滴／□勇往直前／□水珠連連」（改寫自楊玲 標點符號），依詩意推敲，空格處應填入下列何者？","opts":["書名號／（　）夾注號","（　）夾注號／　　　書名號","—破折號／……刪節號","……刪節號／—破折號。"],"ans":2,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812995","img":0},{"q":"文章裡用來標明語意轉變、聲音延續、時空起止或用為夾注的符號，稱為破折號。下列各句破折號的使用，何者正確？","opts":["電視公司為了賺錢——不惜拍一些荒誕無稽的電視劇來取悅觀眾","我們擁有秀麗的山川——豐富的物產，多元的文化，安樂的生活","這樣一來，一場，二場，三場，——就接二連三的兵敗如山倒了","這個企畫案愈修改問題愈多——也罷，反正我們不可能盡善盡美。"],"ans":3,"sec":"選擇題","diff":"中","src":"95基本學測一","exp":"（Ａ）應用逗號。因語意未完，語氣未完結　（Ｂ）應用逗號。因語意未完，語氣未完結　（Ｃ）應用刪節號。用在語句未完，意思未盡時　（Ｄ）語氣轉變","id":"2CH0870545","img":0},{"q":"「只有一個桃子是給康康的不是給軒軒的」，這句話應如何斷句，才能使軒軒得到桃子？","opts":["只有一個桃子是給康康的？不是給軒軒的？","只有一個桃子，是給康康的，不是給軒軒的？","只有一個桃子，是給康康的，不是給軒軒的。","只有一個桃子，是給康康的？不！是給軒軒的。"],"ans":3,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812991","img":0},{"q":"下列文句中的標點符號，何者使用正確？","opts":["同伴激動、亢奮歡呼，我則隨駱駝踩踏絲綢般漫漫黃沙，一步一腳印走回自己的文藝少年時代……","同伴激動！亢奮歡呼。我則隨駱駝踩踏絲綢般漫漫黃沙，一步一腳印走回自己的文藝少年時代","同伴激動、亢奮歡呼；我則隨駱駝踩踏絲綢般漫漫黃沙，一步一腳印走回自己的文藝少年時代","同伴激動。亢奮歡呼！我則隨駱駝踩踏絲綢般漫漫黃沙，一步一腳印走回自己的文藝少年時代—。"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812986","img":0},{"q":"清代詞人納蘭性德的采桑子，描寫一位閨中女子清晨醒來的所見所思，以下其譯文：「夜涼露生，使得露氣潤溼了琴絃，露珠暗暗滴落在花梢上。忽見簾外疏影輕搖，是誰？原來是燕子飛過，帶來一陣微風，拂動了柳條。」據此判斷，下列何者為正確的斷句？","opts":["涼生露氣湘，絃潤暗滴花梢。簾影誰搖燕，蹴風絲上柳條","涼生露氣湘絃，潤暗滴花梢。簾影誰搖燕蹴，風絲上柳條","涼生露氣湘絃潤，暗滴花梢。簾影誰搖，燕蹴風絲上柳條","涼生露氣湘絃潤暗，滴花梢。簾影誰搖燕蹴風絲，上柳條。"],"ans":2,"sec":"選擇題","diff":"中","src":"96基本學測一","exp":"由譯文可知：第一句為「夜涼露生，使得露氣潤溼了琴絃」；第二句為「露珠暗暗滴落在花梢上」；第三句為「忽見簾外疏影輕搖，是誰」；第四句為「原來是燕子飛過，帶來一陣微風，拂動了柳條」，故選（Ｃ）","id":"2CH0870609","img":0},{"q":"「我只希望，我們的距離□我和所有野鳥的距離，永遠是這樣接近。」句中空格處填入下列哪一種標點符號最恰當？","opts":["；","！","……","——。"],"ans":3,"sec":"選擇題","diff":"中","src":"104教育會考","exp":"題幹中，「我和所有野鳥的距離」是用來補充前文「我們的距離」，而「破折號」是用於行文中補充說明某詞語，且此說明後文氣需要停頓的符號，故選（Ｄ）。（Ａ）用於分開複句中平列的句子　（Ｂ）用於感嘆語氣及加重語氣的詞、語、句之後　（Ｃ）用於節略原文、語句未完、意思未盡，或表示語句斷斷續續等","id":"2CH0880055","img":0},{"q":"「依稀記得那年我們到太平山上看流星的時刻，四周傳來風吹動葉子的聲響，微風不僅吹拂葉子，也輕拂在我們充滿期待的臉上，抬頭看向天空，滿天的星斗出現急速閃動的星辰，一顆、兩顆□載著我們滿心的祈願□消逝天際。」文中缺空處，依序應填入下列何者？","opts":["……──","──、","！……","～："],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"（Ａ）第一個缺空處省略後面的顆數，故使用刪節號「……」。第二個缺空處，滿心的祈願後語意轉變，故使用破折號「──」","id":"2CH0814981","img":0},{"q":"「寒夜中，不管是誰家的燈光，都讓人—尤其是漂泊的旅人—有種溫暖的感覺。」文句中在「尤其是漂泊的旅人」的前後使用夾注號，具有什麼作用？","opts":["用來注釋上文","用來標示條列次序","用來列舉事物","用來補充說明。"],"ans":3,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812959","img":0},{"q":"就標點符號的使用而言，下列何者最能表達層次分明的效果？","opts":["慘象，已使我目不忍視，流言，更使我耳不忍聞","慘象，已使我目不忍視。流言，更使我耳不忍聞","慘象已使我目不忍視了，流言更使我耳不忍聞","慘象，已使我目不忍視；流言，更使我耳不忍聞。"],"ans":3,"sec":"選擇題","diff":"中","src":"90基測樣本一","exp":"","id":"2CH0870012","img":0},{"q":"「真正的慧眼，是遼闊的，是包含一切的；它看了綠葉，還看見葉背後暗藏的軟蟲；它看見滿溪清水，也知道那水會暴漲變黃。」這段文字的含義，與下列何者最接近？","opts":["肚量當如海涵春育，操守應如青天白日","大其心以容天下之物，虛其心以受天下之善","智者知其一亦知其二，見其所見亦見其所不見","君子不謗議他人以成己善，不掩沒天理以護己過。"],"ans":2,"sec":"選擇題","diff":"中","src":"100北北基聯測","exp":"題幹中「它看了綠葉，還看見葉背後暗藏的軟蟲；它看見滿溪清水，也知道那水會暴漲變黃」，可知真正的智者能夠「見微知著」，與（Ｃ）意涵最接近，故選（Ｃ）。（Ａ）勉人肚量寬宏、品德高尚　（Ｂ）勉人要放寬心胸，以容納天下事物；謙沖自牧，以接受天下良善　（Ｃ）說明智者能舉一反三、見微知著　（Ｄ）說明君子不毀謗他人以成就自己的善，也不違背天理來掩護自己的過錯","id":"2CH0871012","img":0},{"q":"「終於有一天，這虛擬的黑色城郭是否也終將骨架崩離，被從這光點般的網路平原連根拔起□」、「是不是早已回到他雲林老家的小鎮、和他的父親一樣，成為一鐵路旁的平交道看守員□」句中空格應依序填入哪些標點符號最恰當？","opts":["？？","！？","。。","。！。"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812972","img":0},{"q":"「我何曾說過你是個小氣鬼？」上述文句中使用的問號，具有什麼樣的語氣？","opts":["懷疑","驚喜","反問","責備。"],"ans":2,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812960","img":0},{"q":"下列文句的標點符號，何者使用最恰當？","opts":["孩子！你去東還是去西；你到底走南還是走北？你或許不知道！方向在蠕動的腳下，你是作決定的主人。","孩子！你去東還是去西？你到底走南還是走北？你或許不知道，方向在蠕動的腳下——你是作決定的主人。","孩子！你去東，還是去西，你到底走南，還是走北？你或許不知道，方向在蠕動的腳下！你是作決定的主人。","孩子！你去東，還是去西？你到底走南，還是走北？你或許不知道？方向在蠕動的腳下。你是作決定的主人？"],"ans":1,"sec":"選擇題","diff":"中","src":"102基本學測","exp":"「你去東還是去西」、「你到底走南還是走北」皆是疑問句，其後應用「？」。「你或許不知道」一句語意未完，其後應用「，」。「你或許不知道，方向在蠕動的腳下」與「你是作決定的主人」間語意轉變，故其間應用「——」。「你是作決定的主人」一句語意完結，其後應用「。」。故選（Ｂ）","id":"2CH0871085","img":0},{"q":"「在國內的醫療系統，所謂的安寧照護還是偏重於生理層面□如何讓一個人在生病與往生過程中不要受到太多生理折磨。然而，一個即將往生□面臨生命最後一段歲月的人，他們的心理狀態是如何？我們如何從身心靈成長的角度幫助這樣的人？這種心理層面上的考慮更是必要。」這段文字□中的標點符號，依序填入下列何者最恰當？","opts":["…… ，","—— 、","； ——","。："],"ans":1,"sec":"選擇題","diff":"中","src":"106教育會考","exp":"（Ｂ）文中的第一個缺空處後為前句安寧照護中「生理層面內涵」的補充說明，故使用破折號「——」；文中的第二個缺空處前後為並列連用的詞語，故使用頓號「、」","id":"2CH0880182","img":0},{"q":"「我的本行是科學而非文學甲也許這正是我的缺失乙也許這反而是我的長處，無論如何我清楚明白丙科學需要人文的關懷丁而文學需要理性的自覺。」根據文意脈絡，甲乙丙丁四處，何者最適合填入標點符號中的冒號？","opts":["甲","乙","丙","丁。"],"ans":2,"sec":"選擇題","diff":"中","src":"114教育會考","exp":"甲、乙、丁處前句意思未完，應用逗號隔開分句。丙處後句用來說明前句「清楚明白」的內容，應使用冒號，故選（Ｃ）","id":"2CH1080124","img":0},{"q":"「今天從學校回來的時候，雪地裡發生了一件可憐的事□小孩們一出街道□就將雪團成了石頭一樣硬的小球來往投擲，有許多人正在旁邊通過。行人之中有的叱叫著說：『停止停止□』忽然聽見驚人的叫聲，急去看時□有一老人落了帽子雙手遮了臉，一個少年立在旁邊叫著：『救人啊□救人啊□」』（亞米契斯 愛的教育）上文空格內應填入的標點符號中，哪一種符號最多？","opts":["！","：","，","；"],"ans":0,"sec":"選擇題","diff":"中","src":"","exp":"題幹應填入的標點符號為：，！，！！","id":"2CH0812988","img":0},{"q":"下列文句中的標點符號，何者使用完全正確？","opts":["畫的一邊是一片白茫茫的江山，畫的另一邊；是雲海環繞的朝陽。","紫禁城有四座城門。南面有午門、北面有神武門、東西有東華門、西華門。","寫文章有兩個基本要求：「有物」，就是要有內容；「有序」，就是要有條理。","諺語和警句是人們智慧的結晶；經常抄摘諺語，警句，可以豐富我們的思維。"],"ans":2,"sec":"選擇題","diff":"中","src":"98基本學測一","exp":"（Ａ）「畫的一邊是一片白茫茫的江山」和「畫的另一邊」是複句中平列的兩個句子，應用分號分開；「畫的另一邊」之後接「是雲海環繞的朝陽」，語意、語氣未完，兩者中間應用逗號標明　（Ｂ）「紫禁城有四座城門」後列舉四座城門，應用冒號提起下文；頓號用在並列連用的詞、語之間，「南面有午門」和「北面有神武門」和「東西有東華門、西華門」三句並非並列連用的詞語，中間應用逗號隔開　（Ｃ）「寫文章有兩個基本要求」後列舉事物，使用冒號正確；「有物」和「有序」為句子中特別強調的詞語，可以用引號標明；「『有物』，就是要有內容」和「『有序』，就是要有條理」是複句中平列的兩個句子，可以用分號分開　（Ｄ）「諺語和警句是人們智慧的結晶」句子意思已完足，後面應用句號標明。「諺語」和「警句」是並列連用的詞、語，中間應用頓號隔開","id":"2CH0870769","img":0},{"q":"八十歲的張老先生為人偏心，為了把財產全部留給兒子而立下了遺囑：「八十老翁親生一子所有財產完全給予女婿外人不得爭奪」。這段文字要如何標點，才能達到張老先生的心願？","opts":["八十老翁親生一子，所有財產完全給予女婿、外人，不得爭奪。","八十老翁親生一子；所有財產完全給予女、婿，外人不得爭奪。","八十老翁親生一子。所有財產，完全給予女，婿外人不得爭奪。","八十老翁親生一子，所有財產完全給予。女婿外人，不得爭奪。"],"ans":3,"sec":"選擇題","diff":"中","src":"90基本學測二","exp":"（Ａ）財產落入女婿及外人之手　（Ｂ）財產是落入女兒、女婿之手　（Ｃ）財產完全落入女兒手中","id":"2CH0870121","img":0},{"q":"亞榮隆．撒可努：「當時，父親也燒著火，跟我說：『睡吧！我們的祖先待會會來查看我們。』」上述文句中使用的驚嘆號，是表示什麼語氣？","opts":["假設","憤怒","祈求","命令。"],"ans":3,"sec":"選擇題","diff":"中","src":"","exp":"","id":"2CH0812962","img":0},{"q":"「媽媽告訴我，昨天她和小阿姨一起逛街時，幫我買了新衣服。」這句話的意思與下列何者相同？","opts":["媽媽告訴我：「昨天我和你小阿姨一起逛街時，幫她買了新衣服。」","媽媽告訴我：「昨天她和我小阿姨一起逛街時，幫你買了新衣服。」","媽媽告訴我：「昨天我和你小阿姨一起逛街時，幫你買了新衣服。」","媽媽告訴我：「昨天你和我小阿姨一起逛街時，幫她買了新衣服。」"],"ans":2,"sec":"選擇題","diff":"難","src":"","exp":"","id":"2CH0812990","img":0},{"q":"「有了它□就能反敗為勝□有了它□就能散發光和熱□它就是豪氣。」上述文句的缺空處依序應填入何組標點符號？","opts":["，，，—","，；，—","。，。：","，，，；"],"ans":1,"sec":"選擇題","diff":"難","src":"","exp":"","id":"2CH0812967","img":0},{"q":"「我們一時一刻的需要□都有無量數的勞動者□無論是勞心或勞力□辛辛苦苦地來供給□而我們坐享其福。」上述文句的缺空處依序應填入何組標點符號？","opts":["，—，，","，— —，","，；，。","，！—，"],"ans":1,"sec":"選擇題","diff":"難","src":"","exp":"","id":"2CH0812965","img":0},{"q":"下列文句中的標點符號，何者使用正確？","opts":["她停了一下？但鞋跟很快又若無其事的踩過地面，響起「鏘—」的銳利迴響。啊！請、請等一下！","她停了一下，但鞋跟很快又若無其事的踩過地面，響起「鏘—」的銳利迴響。「啊！請、請等一下。」","她停了一下。但鞋跟很快又若無其事的踩過地面，響起：鏘—的銳利迴響。「啊，請、請等一下。」","她停了一下，但鞋跟很快又若無其事的踩過地面，響起「鏘—」的銳利迴響—「啊？請！請等一下？」。"],"ans":1,"sec":"選擇題","diff":"難","src":"","exp":"","id":"2CH0812984","img":0},{"q":"下列文句中的標點符號，何者使用正確？","opts":["舊情人接過餐盤：「今天 ts":["無魚，肉也可；無雞，鴨也可。清茶淡飯不可少，薪水也不要。","無魚肉也可，無雞鴨也可，清茶淡飯不可少，薪水也不要。","無魚，肉也可；無雞，鴨也可。清茶淡飯不可，少薪水也不要。","無魚肉也可，無雞鴨也可；清茶淡飯不可，少薪水也不要。"],"ans":1,"sec":"延伸素養","diff":"易","src":"","exp":"","id":"2CH0815079","img":0},{"q":"老王因住家離車站很近，很多過往行人常在其屋角隨地小便，讓他苦不堪言。於是他立了一個告示牌，上寫著：「過往行人等不得在此小便」，結果情況並沒有改善，因他忘了加標點。如果你替他加上標點，下列何者才符合他的本意？","opts":["過往行人，等不得在此，小便","過往行人等，不得在此小便","過往行人等，不！得在此小便","過往行人等不得，在此小便。"],"ans":1,"sec":"延伸素養","diff":"易","src":"","exp":"","id":"2CH0815077","img":0},{"q":"「巴爾肯博士是美國著名社會心理學家，他在一次宴會上提議，每人用最簡單的話寫一篇自傳。後來一位神情沮喪的年輕人寫了一篇只用三個標點符號的自傳。他的解釋是：『曾經橫衝直撞，落了個傷心自嘆，到頭來只好完蛋。』」根據年輕人的解釋，他這篇自傳的三個標點符號依序應為何者？","opts":["—！。","？　　　；","：……、","—？，"],"ans":0,"sec":"延伸素養","diff":"中","src":"","exp":"","id":"2CH0815080","img":0},{"q":"老師請同學說明標點符號的重要性，下列哪一位同學的認知錯誤？","opts":["阿堯：可以使文字的重要性超過搭配的插圖","阿寧：可以使文氣流暢、文意精準","阿翔：可以節省閱讀的時間","阿舜：可以避免因語意不明而造成誤解。"],"ans":0,"sec":"延伸素養","diff":"中","src":"","exp":"","id":"2CH0815075","img":0},{"q":"有位年輕男子找媒婆介紹女友，媒婆在紙上寫著：「我敢保證黑頭髮沒有麻子腳不大端正」，男子很高興的約了女孩見面，但是見面後卻大失所望，原來是他誤解了媒婆的話。媒婆的話若加上標點，應是下列哪一個選項？","opts":["我敢保證：黑頭髮，沒有麻子，腳不大端正。","我敢保證：黑頭髮，沒有麻子，腳不大，端正。","我敢保證：黑頭髮沒有，麻子，腳不大端正。","我敢保證：黑頭髮，沒有麻子腳，不大端正。"],"ans":2,"sec":"延伸素養","diff":"中","src":"","exp":"","id":"2CH0815076","img":0},{"q":"有一位飯店老闆，為招攬生意，在店門掛了一副對聯「釀酒缸缸好做醋罈罈酸養豬大如山老鼠隻隻亡」。若想讓飯店高朋滿座，下列何者的斷句方式才具有祝福的意思？","opts":["釀酒缸，缸好做醋罈，罈酸養豬，大如山老鼠，隻隻亡","釀酒缸缸好做醋，罈罈酸；養豬大如山老鼠，隻隻亡","釀酒缸缸好，做醋罈罈酸；養豬大如山，老鼠隻隻亡","釀酒，缸缸好做醋—罈罈酸。養豬大如山老，鼠隻隻亡。"],"ans":2,"sec":"延伸素養","diff":"難","src":"","exp":"","id":"2CH0815078","img":0}];

 {u:"行文中為補充說明某詞語之處，而此說明後語氣需要停頓。",ex:"這件事在經過這麼多波折後，終於逐漸有了轉機<i class=hl>——</i>真可謂倒吃甘蔗<i class=hl>——</i>漸入佳境。"}]},
{nm:"專名號",sym:"＿",wd:"長度與名稱齊",uses:[
 {u:"用於人名、族名、國名、地名、路線名、機構名、建築名、時代名、山川、湖泊。直行標在專名左旁，橫行標在專名之下。",ex:"<span class=pn>孫中山</span>先生、<span class=pn>阿美族</span>、<span class=pn>中華民國</span>、<span class=pn>臺北市</span>、<span class=pn>中山高速公路</span>、<span class=pn>中日航線</span>、<span class=pn>教育部</span>、<span class=pn>漢朝</span>、<span class=pn>阿里山</span>、<span class=pn>濁水溪</span>、<span class=pn>伊甸基金會</span>"}]},
{nm:"驚嘆號",sym:"！",wd:"占一格",uses:[
 {u:"用於感嘆語氣及加重語氣的詞、語、句之後。",ex:"你還吃月光餅<i class=hl>！</i>再吃，臉長得更大更扁，雀斑就跟餅上的芝麻那麼多了。"}]},
{nm:"書名號",sym:"～ 或 〈〉《》",wd:"波浪線長度與書名齊；〈〉《》前後各占一格",uses:[
 {u:"波浪線：直行標在書名左方，橫行標在書名之下。",ex:"<span class=bn>史記</span>、<span class=bn>項羽本紀</span>、<span class=bn>屍速列車</span>、<span class=bn>浮生六記</span>、<span class=bn>清明上河圖</span>、<span class=bn>臺灣旅遊地圖</span>"},
 {u:"〈　〉多用於篇名，《　》多用於書名。",ex:"<i class=hl>《</i>史記<i class=hl>》</i>、<i class=hl>〈</i>項羽本紀<i class=hl>〉</i>、<i class=hl>《</i>史記．項羽本紀<i class=hl>》</i>、<i class=hl>《</i>屍速列車<i class=hl>》</i>、<i class=hl>《</i>終於等到你<i class=hl>》</i>、<i class=hl>〈</i>清明上河圖<i class=hl>〉</i>、<i class=hl>《</i>臺灣旅遊地圖<i class=hl>》</i>"}]},
{nm:"間隔號",sym:"．",wd:"占一格",uses:[
 {u:"用於書名與篇章卷名之間。",ex:"《禮記<i class=hl>．</i>禮運》"},
 {u:"用於套書與單本書名之間。",ex:"《青少年文庫<i class=hl>．</i>傲慢與偏見》"},
 {u:"用於原住民命名習慣之間隔。",ex:"瓦歷斯<i class=hl>．</i>貝林"},
 {u:"用於外國人名字與姓氏之間。",ex:"馬克<i class=hl>．</i>吐溫"}]},
{nm:"連接號",sym:"— 或 ～",wd:"占一格",uses:[
 {u:"用於連接時空的起止。",ex:"搭高鐵，從北到南（臺北<i class=hl>—</i>左營）不用兩小時。"},
 {u:"連接數量的多寡。",ex:"這本書第 1 <i class=hl>～</i> 6 頁是目錄。"}]}
];
const CMP=[
["項目","頓　號　、","逗　號　，","分　號　；"],
["相異處","用於並列詞語。","區隔語句較長的句子。","用於複句的對比、並列。"],
["舉例","香港<i class=hl>、</i>南韓<i class=hl>、</i>新加坡及臺灣，曾被稱為亞洲四小龍。","他洗了臉<i class=hl>，</i>穿好了衣服<i class=hl>，</i>吃了早飯<i class=hl>，</i>就上學去。","鯨魚是獸類，不是魚類<i class=hl>；</i>蝙蝠是獸類，不是鳥類。"],
["停頓時間","依一句話裡分句之間的停頓時間長短來分，依次為：<b>分號 ＞ 逗號 ＞ 頓號</b>。","",""]
];

/* ===== 學習重點渲染 ===== */
(function(){
  const num=(m,i)=>m.uses.length>1?(i+1)+". ":"";
  $("#marks").innerHTML='<tr><th>名稱</th><th>書寫方式</th><th>使用方式</th><th>例句</th></tr>'+
    MARKS.map(m=>'<tr><td class="nm">'+m.nm+'<span class="sym">'+m.sym+'</span></td>'+
      '<td class="wd">'+m.wd.replace(/；/g,"；<br>")+'</td>'+
      '<td>'+m.uses.map((u,i)=>'<span class="ln">'+num(m,i)+u.u+'</span>').join("")+'</td>'+
      '<td class="exc">'+m.uses.map((u,i)=>'<span class="ln">'+num(m,i)+u.ex+'</span>').join("")+'</td></tr>').join("");
  $("#cmptab").innerHTML=CMP.map((r,i)=>{
    if(i===0)return '<tr>'+r.map(c=>'<th>'+c+'</th>').join("")+'</tr>';
    if(i===3)return '<tr><td>'+r[0]+'</td><td colspan="3">'+r[1]+'</td></tr>';
    return '<tr>'+r.map((c,k)=>'<td>'+c+'</td>').join("")+'</tr>';
  }).join("");
})();

/* ===== 分頁 ===== */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
  $("#pane-"+t.dataset.tab).classList.add("show");
});

/* ===== 測驗 ===== */
let secSel="all", diffSel="all", QZ=null;
const pool=()=>QS.filter(q=>(secSel==="all"||q.sec===secSel)&&(diffSel==="all"||q.diff===diffSel));
function chips(box,cur,items,fn){
  const b=$(box);b.innerHTML="";
  items.forEach(it=>{const c=document.createElement("button");c.className="chip"+(cur===it.v?" active":"");
    c.textContent=it.t;c.onclick=()=>{fn(it.v);renderChips();renderList();};b.appendChild(c);});
}
function renderChips(){
  const cnt=f=>QS.filter(f).length;
  chips("#secChips",secSel,[
    {v:"all",t:"全部（"+QS.length+" 題）"},
    {v:"選擇題",t:"選擇題（"+cnt(q=>q.sec==="選擇題")+"）"},
    {v:"延伸素養",t:"延伸素養（"+cnt(q=>q.sec==="延伸素養")+"）"}],v=>{secSel=v;});
  chips("#diffChips",diffSel,[
    {v:"all",t:"所有難度"},
    {v:"易",t:"易（"+cnt(q=>q.diff==="易")+"）"},
    {v:"中",t:"中（"+cnt(q=>q.diff==="中")+"）"},
    {v:"難",t:"難（"+cnt(q=>q.diff==="難")+"）"}],v=>{diffSel=v;});
  $("#startBtn").textContent="📝 開始測驗（"+pool().length+" 題）";
  let best=0;try{best=+localStorage.getItem("punct_best_"+secSel+"_"+diffSel)||0;}catch(e){}
  $("#poolStat").textContent=best?("此範圍最佳答對率 "+best+"%"):"";
  if(QZ)qQuit(); /* 換範圍中止進行中的測驗 */
}
function qHTML(q){
  let s=esc(q.q).replace(/□/g,'<i class="hl">□</i>');
  if(q.img)s='<img class="qi" src="'+IMGS[q.img]+'" alt="題目附圖">'+s;
  return s;
}
function renderList(){
  const arr=pool();
  $("#qlist").innerHTML=arr.map((q,i)=>{
    const gi=QS.indexOf(q);
    return '<div class="qitem"><span class="topic">'+q.sec+'・'+q.diff+'</span>'+(q.src?' <span class="topic">'+esc(q.src)+'</span>':'')+
    '<div class="q">'+(i+1)+'. '+qHTML(q)+'</div>'+
    '<div class="o">'+q.opts.map((o,k)=>"（"+"ＡＢＣＤ"[k]+"）"+esc(o)).join("　")+'</div>'+
    '<button class="btn ghost sm" onclick="tglA(this)">👁 看答案</button>'+
    '<div class="a"><b>正解（'+"ＡＢＣＤ"[q.ans]+'）'+esc(q.opts[q.ans])+'</b>'+(q.exp?'<div style="margin-top:4px">詳解：'+esc(q.exp)+'</div>':'')+'</div></div>';
  }).join("");
}
window.tglA=function(btn){btn.nextElementSibling.classList.toggle("show");};
function qStart(list){
  QZ={list:shuffle((list||pool()).slice()),i:0,score:0,wrong:[],full:!list};
  if(!QZ.list.length){alert("此範圍沒有題目。");QZ=null;return;}
  $("#qlist").style.display="none";$("#startBtn").style.display="none";
  qRender();
}
function qQuit(){$("#quizBox").innerHTML="";$("#qlist").style.display="";$("#startBtn").style.display="";QZ=null;}
function qRender(){
  const q=QZ.list[QZ.i],n=QZ.list.length;
  let s='<div class="progress"><i style="width:'+(QZ.i/n*100)+'%"></i></div>';
  s+='<div class="counter">第 '+(QZ.i+1)+' / '+n+' 題　|　得分 '+QZ.score+'</div>';
  s+='<div class="exam"><span class="topic">'+q.sec+'・'+q.diff+'</span>'+(q.src?' <span class="src">'+esc(q.src)+'</span>':'');
  s+='<div class="q">'+qHTML(q)+'</div>';
  s+='<div class="eopts">'+q.opts.map((o,k)=>'<button class="eopt" data-k="'+k+'"><span class="k">（'+"ＡＢＣＤ"[k]+'）</span><span>'+esc(o)+'</span></button>').join("")+'</div>';
  s+='<div class="expl"></div></div>';
  s+='<div class="nav"><button class="btn ghost sm" id="qquit">結束</button><button class="btn primary" id="qnext" style="display:none">下一題 ▶</button></div>';
  $("#quizBox").innerHTML=s;
  document.querySelectorAll("#quizBox .eopt").forEach(b=>b.onclick=()=>qChoose(b,q));
  $("#qquit").onclick=qQuit;
  $("#qnext").onclick=()=>{QZ.i++;if(QZ.i<n)qRender();else qFinish();};
}
function qChoose(btn,q){
  const k=+btn.dataset.k, ok=k===q.ans;
  document.querySelectorAll("#quizBox .eopt").forEach(x=>x.onclick=null);
  document.querySelectorAll("#quizBox .eopt")[q.ans].classList.add("correct");
  if(!ok)btn.classList.add("wrong");
  if(ok)QZ.score++;else QZ.wrong.push(q);
  const e=$("#quizBox .expl");
  let s='<span class="lbl">'+(ok?"✅ 答對了":"❌ 正解")+'</span>（'+"ＡＢＣＤ"[q.ans]+'）'+esc(q.opts[q.ans]);
  if(q.exp)s+='<div style="margin-top:6px">💡 '+esc(q.exp)+'</div>';
  e.innerHTML=s;e.classList.add("show");
  const nx=$("#qnext");nx.style.display="inline-block";nx.focus();
}
function qFinish(){
  const n=QZ.list.length,pct=Math.round(QZ.score/n*100);
  const emoji=pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"📖";
  try{if(QZ.full){const key="punct_best_"+secSel+"_"+diffSel;const best=Math.max(+localStorage.getItem(key)||0,pct);localStorage.setItem(key,best);}}catch(e){}
  const rv=QZ.wrong.length
    ?'<div class="review"><h3 style="color:var(--muted);margin:14px 0 4px">📌 需複習（'+QZ.wrong.length+'）</h3>'+
      QZ.wrong.map(q=>'<div class="r"><div>'+qHTML(q)+'</div><b style="color:var(--ok)">正解（'+"ＡＢＣＤ"[q.ans]+'）'+esc(q.opts[q.ans])+'</b>'+(q.exp?'<div style="color:var(--muted);margin-top:3px">'+esc(q.exp)+'</div>':'')+'</div>').join("")+'</div>'
    :'<p style="color:var(--ok);font-weight:800;margin-top:12px">🌟 全部答對！</p>';
  const wrong=QZ.wrong.slice();
  $("#quizBox").innerHTML='<div class="scorebox"><div style="font-size:3rem">'+emoji+'</div><div class="big">'+QZ.score+' / '+n+'</div>'+
    '<div style="font-weight:800;color:var(--muted)">答對率 '+pct+'%</div><div class="nav">'+
    (wrong.length?'<button class="btn primary" id="againWrong">🔁 只測錯的</button>':'')+
    '<button class="btn '+(wrong.length?'ghost':'primary')+'" id="againAll">↻ 再測一次</button>'+
    '<button class="btn ghost" id="backList">⬅ 回題目列表</button></div>'+rv+'</div>';
  QZ=null;
  renderChips(); /* 更新最佳紀錄顯示 */
  if(wrong.length)$("#againWrong").onclick=()=>qStart(wrong);
  $("#againAll").onclick=()=>qStart();
  $("#backList").onclick=qQuit;
}
$("#startBtn").onclick=()=>qStart();
renderChips();renderList();
</script>
</body>
</html>
